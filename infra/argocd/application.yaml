apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meetspace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/salaahks/MeetSpace.git
    targetRevision: main
    path: infra/k8s
    directory:
      exclude: 'secrets.example.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
