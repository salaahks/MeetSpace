apiVersion: apps/v1
kind: Deployment
metadata:
  name: meetspace-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meetspace-backend
  template:
    metadata:
      labels:
        app: meetspace-backend
    spec:
      imagePullSecrets:
      - name: registry-secret
      containers:
      - name: meetspace-backend
        image: registry.local/meetspace/backend:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: meetspace-backend-config
        - secretRef:
            name: meetspace-azure
        env:
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: meetspace-db
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: meetspace-db
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
