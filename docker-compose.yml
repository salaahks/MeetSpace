# Local stack: PostgreSQL + Spring Boot API + Next.js UI.
# Copy .env.example to .env and fill in your own values first.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./code/backend
      dockerfile: ../../infra/java/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_DOMAIN: ${AZURE_TENANT_DOMAIN}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./code/frontend
      dockerfile: ../../infra/nodejs/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_MSAL_CLIENT_ID: ${MSAL_CLIENT_ID}
        NEXT_PUBLIC_MSAL_AUTHORITY: https://login.microsoftonline.com/${AZURE_TENANT_ID}
        NEXT_PUBLIC_MSAL_REDIRECT_URI: http://localhost:3000
        NEXT_PUBLIC_TENANT_DOMAIN: ${AZURE_TENANT_DOMAIN}
        NEXT_PUBLIC_SUPPORT_TICKET_URL: ${SUPPORT_TICKET_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
